artifacts_root: artifacts


data_ingestion:
  root_dir: artifacts/data_ingestion
  source_URL: https://github.com/frosa-create/CDC_Project/raw/refs/heads/main/Chicken_Fecal_Images.zip
  local_data_file: artifacts/data_ingestion/data.zip
  unzip_dir: artifacts/data_ingestion/data


data_validation:
  root_dir: artifacts/data_validation
  STATUS_FILE: artifacts/data_validation/status.txt
  raw_data_dir: artifacts/data_ingestion/data/Chicken_Fecal_Images
  sorted_data_dir: artifacts/data_ingestion/data/Chicken_Fecal_Images_Sorted
  valid_labels:
    -"salmo"
    -"cocci"
    -"healthy"
  valid_extensions: [".jpg",".jpeg",".png"]
  min_files_per_class: 10
  max_file_size_mb: 15



prepare_base_model:
  root_dir: artifacts/prepare_base_model
  base_model_path: artifacts/prepare_base_model/base_model.h5
  updated_base_model_path: artifacts/prepare_base_model/base_model_updated.h5




prepare_callbacks:
  root_dir: artifacts/prepare_callbacks
  tensorboard_root_log_dir: artifacts/prepare_callbacks/tensorboard_log_dir
  checkpoint_model_filepath: artifacts/prepare_callbacks/checkpoint_dir/model.h5


training:
  root_dir: artifacts/training
  trained_model_path: artifacts/training/model.h5
  training_data: artifacts/data_ingestion/data/Chicken_Fecal_Images_Sorted
